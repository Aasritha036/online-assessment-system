<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<title>Online Assessment</title>
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<meta content="" name="keywords">
	<meta content="" name="description">

	<!-- Favicon -->
	<link href="img/favicon.ico" rel="icon">

	<!-- Google Web Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@600&family=Lobster+Two:wght@700&display=swap"
		rel="stylesheet">

	<!-- Icon Font Stylesheet -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

	<!-- Libraries Stylesheet -->
	<link href="lib/animate/animate.min.css" rel="stylesheet">
	<link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

	<!-- Customized Bootstrap Stylesheet -->
	<link href="css/bootstrap.min.css" rel="stylesheet">

	<!-- Template Stylesheet -->
	<link href="css/style.css" rel="stylesheet">
</head>

<body>
	<div class="container-xxl bg-white p-0">
		<!-- Spinner Start -->
		<div id="spinner"
			class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
			<div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
				<span class="sr-only">Loading...</span>
			</div>
		</div>
		<!-- Spinner End -->


		<!-- Navbar Start -->
		<nav class="navbar navbar-expand-lg bg-white navbar-light sticky-top px-4 px-lg-5 py-lg-0">
			<a href="index.html" class="navbar-brand">
				<h1 class="m-0 text-primary"><i class="fa fa-book-reader me-3"></i>Online Assessment</h1>
			</a>
			<button type="button" class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarCollapse">
				<div class="navbar-nav mx-auto">
					<a th:href="@{/studentHome}" class="nav-item nav-link">Home</a>
					<a th:href="@{/quizList}" class="nav-item nav-link">Quizes</a>
					<a th:href="@{/performance}" class="nav-item nav-link active">Attempted Quizes</a>
					<a href="" class="nav-item nav-link"><input type="hidden"></a>
					<a href="" class="nav-item nav-link"><input type="hidden"></a>
					<a href="" class="nav-item nav-link"><input type="hidden"></a>
					<a href="" class="nav-item nav-link"><input type="hidden"></a>
					<a href="" class="nav-item nav-link"><input type="hidden"></a>
					<a href="" class="nav-item nav-link"><input type="hidden"></a>
					<a href="" class="nav-item nav-link"><input type="hidden"></a>
					<a href="" class="nav-item nav-link"><input type="hidden"></a>
					<a href="" class="nav-item nav-link"><input type="hidden"></a>
					<a href="" class="nav-item nav-link"><input type="hidden"></a>
					<!--                    <a href="" class="nav-item nav-link" th:text="${session.username}"></a>-->
					<div class="nav-item dropdown">
						<a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown"
							th:text="${session.username}"></a>
						<div class="dropdown-menu rounded-0 rounded-bottom border-0 shadow-sm m-0">
							<a th:href="@{/quizList}" class="dropdown-item">Quizes</a>
							<a th:href="@{/performance}" class="dropdown-item">Scores</a>
						</div>
					</div>
				</div>
				<a th:href="@{/logout}" class="btn btn-primary rounded-pill px-3 d-none d-lg-block">Logout<i
						class="fa fa-arrow-right ms-3"></i></a>
			</div>
		</nav>

		<div class="container my-2">

			<table border="1" class="table table-hover table-responsive-md">
				<thead>
					<tr>
						<th>Quiz</th>
						<th> Percentage </th>
						<th> Action </th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="quiz : ${quizMap}">
						<td th:text="${quiz.getKey().QuizTitle}"></td>
						<td th:text="${quiz.value}"></td>
						<td><a th:href="@{/viewPaper/{id} (id=${quiz.getKey().quizId})}"
								class="btn btn-outline-primary">View Paper</a></td>
					</tr>
				</tbody>
			</table>
		</div>

		<!-- Back to Top -->
		<a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"><i class="bi bi-arrow-up"></i></a>
	</div>

	<!-- JavaScript Libraries -->
	<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="lib/wow/wow.min.js"></script>
	<script src="lib/easing/easing.min.js"></script>
	<script src="lib/waypoints/waypoints.min.js"></script>
	<script src="lib/owlcarousel/owl.carousel.min.js"></script>

	<!-- Template Javascript -->
	<script src="js/main.js"></script>
</body>

</html>
