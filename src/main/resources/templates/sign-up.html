<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<meta name="description" content="">
	<meta name="author" content="">

	<title>Online Assessment - Sign Up Page</title>

	<!-- CSS FILES -->
	<link rel="preconnect" href="https://fonts.googleapis.com">

	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&display=swap" rel="stylesheet">

	<link href="css/bootstrap.min.css" rel="stylesheet">
	<link href="css/bootstrap-icons.css" rel="stylesheet">

	<link rel="stylesheet" href="css/slick.css" />

	<link href="css/tooplate-little-fashion.css" rel="stylesheet">

	<!--

</head>

<body>

	<section class="preloader">
		<div class="spinner">
			<span class="sk-inner-circle"></span>
		</div>
	</section>

	<main>

		<section class="sign-in-form section-padding">
			<div class="container">
				<div class="row">

					<div class="col-lg-8 mx-auto col-12">

						<h1 class="hero-title text-center mb-5">Sign Up</h1>

						<!--                            <div class="social-login d-flex flex-column w-50 m-auto">-->

						<!--                                <a href="#" class="btn custom-btn social-btn mb-4">-->
						<!--                                    <i class="bi bi-google me-3"></i>-->

						<!--                                    Continue with Google-->
						<!--                                </a>-->

						<!--                                <a href="#" class="btn custom-btn social-btn">-->
						<!--                                    <i class="bi bi-facebook me-3"></i>-->

						<!--                                    Continue with Facebook-->
						<!--                                </a>-->
						<!--                            </div>-->

						<!--                            <div class="div-separator w-50 m-auto my-5"><span>or</span></div>-->

						<div class="row">
							<div class="col-lg-8 col-11 mx-auto">
								<form role="form" method="post" th:action="@{/addUser}" th:object="${user}">

									<div class="form-floating">
										<input type="text" name="userName" id="userName" class="form-control"
											placeholder="Name" required>

										<label for="userName">Full Name</label>
									</div>

									<div class="form-floating my-4">
										<input type="email" name="userEmail" id="userEmail" pattern="[^ @]*@[^ @]*"
											class="form-control" placeholder="Email address" required>

										<label for="email">Email address</label>
									</div>

									<div class="form-floating my-4">
										<input type="password" name="password" id="password"
											pattern="(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*\W)(?!.* ).{8,}"
											class="form-control" placeholder="Password" required>

										<!--                                            <input type="password" name="password" id="password" pattern="[0-9a-zA-Z]{8,20}" class="form-control" placeholder="Password" required>-->

										<label for="password">Password</label>

										<p class="text-center">* Password must contain one digit from 1 to 9, one
											lowercase letter, one uppercase letter, one special character, no space, and
											it must be 8-16 characters long.</p>
									</div>

									<div class="form-floating">
										<select id="role" name="role" class="form-control" required>
											<option value="">Select</option>
											<option value="student">Student</option>
											<option value="instructor">Instructor</option>
										</select>
										<label for="role">Role</label>
									</div>

									<!--                                        <div class="form-floating">-->
									<!--                                            <input type="password" name="confirm_password" id="confirm_password" pattern="[0-9a-zA-Z]{4,10}" class="form-control" placeholder="Password" required>-->

									<!--                                            <label for="confirm_password">Password Confirmation</label>-->
									<!--                                        </div>-->
									<div th:if="${error}" th:text="${error}" style="color: red;"></div>
									<button type="submit" class="btn custom-btn form-control mt-4 mb-3">
										Create account
									</button>

									<p class="text-center">Already have an account? Please <a th:href="@{/login}">Sign
											In</a></p>

								</form>
							</div>
						</div>

					</div>

				</div>
			</div>
		</section>

	</main>

	<!-- JAVASCRIPT FILES -->
	<script src="js/jquery.min.js"></script>
	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/Headroom.js"></script>
	<script src="js/jQuery.headroom.js"></script>
	<script src="js/slick.min.js"></script>
	<script src="js/custom.js"></script>

</body>

</html>
